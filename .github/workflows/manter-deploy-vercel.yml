# Mantém atividade no deploy da Vercel (evita projeto pausado por inatividade no plano Hobby).
# 1. Vercel → Projeto → Settings → Git → Deploy Hooks → criar hook na branch production/main.
# 2. GitHub → Repositório → Settings → Secrets → Actions → criar VERCEL_DEPLOY_HOOK com a URL completa do hook.
# Sem o segredo, este workflow falha de propósito no passo curl (para não mascarar configuração em falta).

name: Manter deploy Vercel ativo

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  disparar-deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook (POST)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Configure o segredo VERCEL_DEPLOY_HOOK no GitHub (URL do Deploy Hook na Vercel)."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
