# Evita que o projeto fique inativo na Vercel (ex.: deploy desativado / pausa no Hobby).
# Depois de cada execução com sucesso, o workflow «Verificar site e recuperar» faz teste HTTP a gabaon.store.
#
# Opção A (recomendada): Vercel → Settings → Git → Deploy Hooks → criar hook na branch de produção.
#         GitHub → Settings → Secrets → Actions → VERCEL_DEPLOY_HOOK = URL completa do hook.
#         Só dispara POST — não polui o histórico de commits.
#
# Opção B (automática): se VERCEL_DEPLOY_HOOK não existir, faz push de commit vazio na branch
#         atual (dispara o mesmo deploy automático que já tens ao guardar no GitHub).

name: Manter deploy Vercel ativo

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redespero-preventivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Hook ou commit vazio
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME:-main}"
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            exit 0
          fi
          echo "::notice::Sem VERCEL_DEPLOY_HOOK — usando commit vazio para disparar redeploy (integração Git → Vercel)."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$BRANCH"
          git commit --allow-empty -m "ci: redespero preventivo (manter Vercel ativo)"
          git push origin "$BRANCH"
